services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-unishare}
      MYSQL_USER: ${DB_USERNAME:-unishare}
      MYSQL_PASSWORD: ${DB_PASSWORD:-unishare}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-unishare_root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-unishare}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-unishare}
      DB_PASSWORD: ${DB_PASSWORD:-unishare}
      JAVA_OPTS: ${JAVA_OPTS:-}
      UPLOADS_DIR: /app/uploads
      ZUINCONSUL_URL: ${ZUINCONSUL_URL:-}
      ZUINCONSUL_TOKEN: ${ZUINCONSUL_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./front
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
